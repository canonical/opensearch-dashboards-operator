request:
  description: Perform an HTTP/HTTPS request from inside the k8s cluster.
  params:
    url:
      type: string
    method:
      type: string
      default: GET
    username:
      type: string
    password:
      type: string
    ca_cert:
      type: string
    payload:
      type: string