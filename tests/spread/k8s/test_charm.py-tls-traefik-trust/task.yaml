summary: test_charm.py
environment:
  TEST_MODULE: test_charm.py
  TEST_TRAEFIK: true
  TEST_TLS: true
  TRANSFER_TRAEFIK_CA: true
  SUBSTRATE: "k8s"

execute: |
  tox run -e integration -- "tests/integration/$TEST_MODULE" --model testing --alluredir="$SPREAD_TASK/allure-results"
artifacts:
  - allure-results
