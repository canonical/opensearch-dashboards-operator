name: Tests

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**.md"
      - ".gitignore"
  schedule:
    - cron: "53 0 * * *" # Daily at 00:53 UTC
  # Triggered on push to branch "main" by .github/workflows/release.yaml
  workflow_call:
    outputs:
      artifact-prefix:
        description: build_charm.yaml `artifact-prefix` output
        value: ${{ jobs.build.outputs.artifact-prefix }}
    secrets:
      CHARMHUB_TOKEN:
        required: false

jobs:
  lint:
    name: Lint
    uses: canonical/data-platform-workflows/.github/workflows/lint_workflows.yaml@v52.0.0
    permissions:
      contents: read

  promtool:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # prometheus snap includes promtool
      - name: Install prometheus snap
        run: sudo snap install prometheus

      - name: Check validity of prometheus alert rules for K8s
        run: |
          promtool check rules kubernetes/src/alert_rules/prometheus/*.yaml

      - name: Check validity of prometheus alert rules for VM
        run: |
          promtool check rules machine/src/alert_rules/prometheus/*.yaml

  terraform-test:
    name: Terraform - Lint and Simple Deployment | ${{ matrix.substrate }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - substrate: machine
            app: opensearch-dashboards
            cloud: localhost
          - substrate: kubernetes
            app: opensearch-dashboards-k8s
            cloud: uk8s
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Terraform
        run: sudo snap install terraform --classic

      - name: lint charm module
        working-directory: ./terraform/${{ matrix.substrate }}/charm/opensearch_dashboards
        run: terraform init && terraform fmt -check && terraform validate
      - name: run checks - prepare
        if: matrix.substrate == 'machine'
        run: |
          sudo snap install juju --channel=3.6 --classic
      - name: LXD setup
        if: matrix.substrate == 'machine'
        run: |
          if snap list lxd >/dev/null 2>&1; then
            sudo snap refresh lxd --channel=latest/stable
          else
            sudo snap install lxd --channel=latest/stable
          fi
          sudo adduser "$USER" 'lxd'
          # `newgrp` does not work in GitHub Actions; use `sg` instead
          sg 'lxd' -c "lxd waitready"
          sg 'lxd' -c "lxd init --auto"
          sg 'lxd' -c "lxc network set lxdbr0 ipv6.address none"
          sudo iptables -F FORWARD
          sudo iptables -P FORWARD ACCEPT
          sg 'lxd' -c "juju bootstrap 'localhost' --config model-logs-size=10G"
      - name: K8s setup
        if: matrix.substrate == 'kubernetes'
        run: |
          # Docker and podman networking conflict with Canonical K8s
          sudo apt-get remove --purge -y docker-ce docker-ce-cli containerd.io docker.io containerd 2>/dev/null || true
          sudo nft flush ruleset
          sudo rm -f /etc/cni/net.d/87-podman-bridge.conflist
          sudo snap install concierge --classic
          sudo concierge prepare -c concierge-k8s.yaml --juju-channel=3.6/stable
          # The controller runs in an LXD container, which can't reach K8s on 127.0.0.1
          sudo k8s kubectl config view --raw | sed "s/127.0.0.1/$(ip -4 -j route get 2.2.2.2 | jq -r '.[0].prefsrc')/" | juju add-k8s uk8s --client --controller concierge-lxd
      - name: Juju setup
        run: |
          juju add-model test ${{ matrix.cloud }} --config logging-config='<root>=INFO; unit=DEBUG'
      - name: Terraform deploy
        working-directory: ./terraform/${{ matrix.substrate }}/charm/opensearch_dashboards
        run: |
          MODEL_UUID=$(juju show-model test | grep "model-uuid" | awk '{split($0, a, ": "); print a[2]}')
          terraform apply -var="model_uuid=$MODEL_UUID" -auto-approve
      - name: Wait for model and applications
        run: |
          juju wait-for application ${{ matrix.app }} -m test --query='status=="blocked"'
          juju wait-for model test --query='life=="alive" && status=="available"'

  build:
    strategy:
      matrix:
        path:
          - kubernetes
          - machine
          - tests/integration/dashboards_application_charm
    name: Build charm | ${{ matrix.path }}
    uses: canonical/data-platform-workflows/.github/workflows/build_charm.yaml@v50.0.0
    with:
      cache: false
      path-to-charm-directory: ${{ matrix.path }}
    permissions:
      contents: read

  integration-test:
    name: Integration test charm
    needs:
      - lint
      - build
    uses: $/.github/workflows/integration_test.yaml
    with:
      artifact-prefix: ${{ needs.build.outputs.artifact-prefix }}
    permissions:
      contents: write # Needed for Allure Report