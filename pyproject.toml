# Testing tools configuration
[tool.coverage.run]
branch = true

[tool.coverage.report]
show_missing = true

[tool.pytest.ini_options]
minversion = "6.0"
log_cli_level = "INFO"
markers = ["unstable"]
asyncio_mode = "auto"

# Formatting tools configuration
[tool.black]
line-length = 99
target-version = ["py310"]

[tool.isort]
profile = "black"

[tool.poetry]
package-mode = false
requires-poetry = ">=2.0.0"

[tool.poetry.dependencies]
python = "^3.10"
tenacity = "^9.1.2"
pyyaml = "^6.0.2"
requests = "^2.32.4"

# TODO: clean any of the notes below and their deps.
[tool.poetry.group.charm-libs.dependencies]
# data_platform_libs/v0/data_interfaces.py
ops = "^2.23.0"
# data_platform_libs/v0/upgrade.py
poetry-core = "^2.1.3"
# tls_certificates_interface/v3/tls_certificates.py
cryptography = "^45.0.4"
jsonschema = "^4.24.0"
# data_platform_libs/v0/upgrade.py requires pydantic ^1.10
# grafana_agent/v0/cos_agent.py requires pydantic
pydantic = "^1.10.17, <2"
# grafana_agent/v0/cos_agent.py
cosl = "^1.0.0"
data-platform-helpers = "^0.1.4"


[tool.poetry.group.fmt]
optional = true


[tool.poetry.group.fmt.dependencies]
black = "^25.1.0"
isort = "^6.0.1"


[tool.poetry.group.lint]
optional = true


[tool.poetry.group.lint.dependencies]
black = "^25.1.0"
isort = "^6.0.1"
flake8 = "^7.0.0"
flake8-docstrings = "^1.7.0"
flake8-copyright = "^0.2.4"
flake8-builtins = "^2.5.0"
pyproject-flake8 = "^7.0.0"
pep8-naming = "^0.15.1"
codespell = "^2.4.1"
pyright = "^1.1.402"
typing-extensions = "^4.12.2"
requests = "^2.32.4"
ops = "^2.23.0"

[tool.poetry.group.unit]
optional = true

[tool.poetry.group.unit.dependencies]
pytest = "^8.4.1"
coverage = { extras = ["toml"], version = "^7.9.1" }
pytest-mock = "^3.14.1"
pyyaml = "^6.0.2"
responses = "^0.25.7"

[tool.poetry.group.integration.dependencies]
pytest = "^8.4.1"
juju = "^3.6.1.3"
tenacity = "^9.1.2"
coverage = { extras = ["toml"], version = "^7.9.1" }
pytest-asyncio = "^0.21.2"
pytest-operator = "^0.43.1"
pytest-microceph = { git = "https://github.com/canonical/data-platform-workflows", tag = "v32.1.0", subdirectory = "python/pytest_plugins/microceph" }
allure-pytest = "^2.15.0"
allure-pytest-default-results = "^0.1.3"
pytest-playwright = "^0.7.0"
oauth_tools = {git = "https://github.com/canonical/iam-bundle", rev = "921d113325eed156e5b54f97c42e6c50810180c0"}
pyjwt = "^2.10.1"

[tool.pyright]
include = ["src"]
extraPaths = ["./lib"]
pythonVersion = "3.10"
pythonPlatform = "All"
typeCheckingMode = "basic"
reportIncompatibleMethodOverride = false
reportImportCycles = false
reportMissingModuleSource = true
reportMissingImports = false
stubPath = ""
