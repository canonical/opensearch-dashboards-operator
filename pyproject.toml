# Testing tools configuration
[tool.pytest.ini_options]
minversion = "6.0"
log_cli_level = "INFO"
markers = ["unstable"]
asyncio_mode = "auto"

# Formatting and linting tools configuration
[tool.ruff]
target-version = "py310"
line-length = 99
exclude = [
  "tests/integration/**/lib",
]

[tool.ruff.lint]
select = ["I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = "dynamic"

[tool.codespell]
skip = "*.lock,single_kernel_opensearch_dashboards/lib,tests/charms/*/lib,tests/integration/*/lib"

[tool.poetry]
package-mode = false
requires-poetry = ">=2.0.0"

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
opensearch-dashboards-charms-single-kernel = "0.0.10"

[tool.poetry.group.format]
optional = true

[tool.poetry.group.format.dependencies]
ruff = "^0.15.21"

[tool.poetry.group.lint]
optional = true

[tool.poetry.group.lint.dependencies]
ruff = "^0.15.21"
codespell = "^2.4.3"

[tool.poetry.group.integration.dependencies]
pytest = "^9.1.1"
juju = "^3.6.1.3"
tenacity = "^9.1.2"
pytest-asyncio = "^0.21.2"
pytest-operator = "^0.43.2"
allure-pytest = "^2.16.0"
allure-pytest-default-results = "^0.1.4"
