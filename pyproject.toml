# Testing tools configuration
[tool.coverage.run]
branch = true

[tool.coverage.report]
show_missing = true

[tool.pytest.ini_options]
minversion = "6.0"
log_cli_level = "INFO"
markers = ["unstable"]
asyncio_mode = "auto"

# Formatting tools configuration
[tool.black]
line-length = 99
target-version = ["py310"]

[tool.isort]
profile = "black"

[tool.poetry]
package-mode = false
requires-poetry = ">=2.0.0"

[tool.poetry.dependencies]
python = "^3.10"

# TODO: clean any of the notes below and their deps.
opensearch-dashboards-charms-single-kernel = "0.0.8"
[tool.poetry.group.charm-libs.dependencies]
# data_platform_libs/v0/data_interfaces.py
ops = "^2.23.0"
# data_platform_libs/v0/upgrade.py
poetry-core = "^2.1.3"
# tls_certificates_interface/v3/tls_certificates.py
cryptography = "^45.0.4"
jsonschema = "^4.24.0"
# data_platform_libs/v0/upgrade.py requires pydantic ^1.10
# grafana_agent/v0/cos_agent.py requires pydantic
pydantic = ">2, <3"
# grafana_agent/v0/cos_agent.py
cosl = "^1.0.0"
data-platform-helpers = "^0.1.7"


[tool.poetry.group.fmt]
optional = true


[tool.poetry.group.fmt.dependencies]
black = "^25.1.0"
isort = "^6.1.0"


[tool.poetry.group.lint]
optional = true


[tool.poetry.group.lint.dependencies]
black = "^25.1.0"
isort = "^6.1.0"
flake8 = "^7.3.0"
flake8-docstrings = "^1.7.0"
flake8-copyright = "^0.2.4"
flake8-builtins = "^2.5.0"
pyproject-flake8 = "^7.0.0"
pep8-naming = "^0.15.1"
codespell = "^2.4.3"
pyright = "^1.1.411"
typing-extensions = "^4.16.0"
requests = "^2.32.4"
ops = "^2.23.0"


[tool.poetry.group.integration.dependencies]
pytest = "^8.4.1"
juju = "^3.6.1.3"
tenacity = "^9.1.4"
coverage = { extras = ["toml"], version = "^7.15.2" }
pytest-asyncio = "^0.26.0"
pytest-operator = "^0.43.2"
pytest-microceph = { git = "https://github.com/canonical/data-platform-workflows", tag = "v32.2.3", subdirectory = "python/pytest_plugins/microceph" }
allure-pytest = "^2.16.0"
allure-pytest-default-results = "^0.1.4"
opensearch-dashboards-charms-single-kernel = "0.0.8"


[tool.pyright]
include = ["src"]
extraPaths = ["./lib"]
pythonVersion = "3.10"
pythonPlatform = "All"
typeCheckingMode = "basic"
reportIncompatibleMethodOverride = false
reportImportCycles = false
reportMissingModuleSource = true
reportMissingImports = false
stubPath = ""
